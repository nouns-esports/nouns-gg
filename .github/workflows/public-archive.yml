name: Public archive safety

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DOMAIN: https://nouns.gg
      NEXT_PUBLIC_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - run: bun apps/website/../../scripts/validate-public-archive.ts
      - run: bun x tsc --noEmit -p apps/website/tsconfig.json
      - run: bun run --cwd apps/website build
